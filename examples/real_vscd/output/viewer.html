<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Room change viewer</title>
<style>
:root{--bg:#f6f6f3;--fg:#1d1d1b;--panel:#ffffff;--line:#dcdcd6;--muted:#6b6b66}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#17181a;--fg:#ecece8;--panel:#202224;--line:#34373b;--muted:#9a9a94}}
:root[data-theme="dark"]{--bg:#17181a;--fg:#ecece8;--panel:#202224;--line:#34373b;--muted:#9a9a94}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,sans-serif;display:flex;height:100vh}
#side{width:320px;flex:none;padding:16px;background:var(--panel);border-right:1px solid var(--line);overflow:auto}
#view{flex:1;position:relative;min-width:0}
h1{font-size:17px;margin:0 0 8px} h2{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 6px}
.legend span{display:inline-flex;align-items:center;gap:6px;margin-right:12px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
ul{list-style:none;padding:0;margin:0} li{padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
li:hover{color:var(--muted)} .k{font-weight:600;text-transform:capitalize}
#hint{position:absolute;left:12px;bottom:10px;color:var(--muted);font-size:12px}
canvas{display:block}
@media (max-width:700px){body{flex-direction:column;height:auto}#side{width:auto;border-right:none;border-bottom:1px solid var(--line)}#view{height:70vh}}
</style>
<script type="importmap">
{"imports":{"three":"./vendor/three.module.js",
"three/addons/controls/OrbitControls.js":"./vendor/OrbitControls.js"}}
</script>
</head>
<body>
<div id="side">
  <h1 id="title"></h1>
  <div class="legend">
    <span><i class="dot" style="background:#9a9a95"></i>unchanged</span>
    <span><i class="dot" style="background:#e0484a"></i>removed</span>
    <span><i class="dot" style="background:#3cb371"></i>added</span>
    <span><i class="dot" style="background:#f0a030"></i>moved</span>
  </div>
  <h2>Changes</h2>
  <ul id="list"></ul>
  <h2>Notes</h2>
  <p id="notes" style="color:var(--muted);margin:0"></p>
</div>
<div id="view"><div id="hint">Drag to orbit, scroll to zoom, click a change to focus it.</div></div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const DATA = {"title": "VSCD env2 (real): what changed?", "unit": "units", "lo": [-3.992, -9.847, -2.875], "hi": [3.469, 2.775, 13.892], "static": [[-2.732, 1.373, 7.985], [-2.612, 1.253, 7.985], [-2.612, 1.373, 7.985], [-2.492, 1.253, 7.985], [-2.252, 1.973, 7.865], [-2.252, 2.093, 7.865], [-2.252, 2.213, 7.865], [-2.252, 2.333, 7.745], [-2.132, 2.213, 7.865], [-2.132, 2.333, 7.745], [-2.132, 2.453, 7.505], [-2.132, 2.453, 7.625], [-2.012, 2.093, 7.985], [-2.012, 2.213, 7.865], [-2.012, 2.333, 7.625], [-2.012, 2.333, 7.745], [-2.012, 2.453, 7.625], [-2.012, 2.573, 7.385], [-1.892, 2.333, 7.625], [-1.892, 2.333, 7.745], [-1.892, 2.573, 7.385], [-1.772, 0.413, 7.985], [-1.772, 1.373, 7.865], [-1.772, 1.493, 7.865], [-1.772, 2.333, 7.625], [-1.772, 2.333, 7.745], [-1.772, 2.573, 7.265], [-1.652, 0.293, 7.985], [-1.652, 0.413, 7.985], [-1.652, 0.533, 7.985], [-1.652, 2.573, 7.265], [-1.532, 0.293, 7.985], [-1.532, 0.413, 7.985], [-1.532, 2.573, 7.265], [-1.412, -9.667, 9.905], [-1.412, 2.573, 7.145], [-1.412, 2.573, 7.265], [-1.292, 0.173, 8.105], [-1.292, 1.133, 9.065], [-1.292, 2.573, 7.145], [-1.172, -9.067, 9.065], [-1.172, -0.067, 8.105], [-1.172, 0.173, 8.105], [-1.052, -0.187, 8.105], [-1.052, 2.573, 6.905], [-1.052, 2.573, 7.025], [-0.932, -9.307, 8.345], [-0.932, 2.453, 7.145], [-0.932, 2.573, 7.025], [-0.932, 2.693, 6.785], [-0.812, -9.427, 9.785], [-0.812, 1.493, 7.745], [-0.812, 1.613, 7.625], [-0.812, 2.453, 7.505], [-0.812, 2.573, 7.025], [-0.692, -9.547, 10.025], [-0.692, -9.427, 9.665], [-0.692, 1.253, 7.745], [-0.692, 2.573, 7.385], [-0.692, 2.693, 5.825], [-0.692, 2.693, 6.785], [-0.572, 2.693, 5.825], [-0.452, -3.307, 13.505], [-0.452, 1.253, 7.625], [-0.452, 1.253, 7.745], [-0.452, 2.213, 7.385], [-0.452, 2.333, 7.385], [-0.452, 2.573, 7.385], [-0.332, 2.573, 7.385], [-0.212, 1.253, 7.625], [-0.092, 2.573, 6.425], [0.028, 1.253, 7.625], [0.148, -9.547, 10.745], [0.148, -6.307, 13.625], [0.148, -1.867, 12.905], [0.148, 2.453, 6.545], [0.148, 2.573, 5.225], [0.148, 2.573, 6.545], [0.268, 0.893, 7.625], [0.268, 2.333, 6.545], [0.268, 2.573, 6.545], [0.388, -4.627, 13.745], [0.388, -3.787, 13.745], [0.388, 2.573, 5.465], [0.508, -9.667, 10.745], [0.508, -9.667, 10.865], [0.508, -3.907, 13.385], [0.508, -3.907, 13.505], [0.508, 2.573, 6.665], [0.628, -3.907, 13.265], [0.628, -3.427, 13.025], [0.628, -3.307, 13.505], [0.628, 2.453, 5.345], [0.628, 2.573, 5.345], [0.628, 2.573, 6.305], [0.748, -5.467, 12.545], [0.748, -2.587, 13.625], [0.868, -9.187, 11.585], [0.988, -9.667, 11.225], [0.988, -8.467, 11.225], [0.988, -8.467, 11.585], [0.988, -7.987, 11.345], [1.108, -8.827, 11.465], [1.108, -4.987, 12.665], [1.228, -9.667, 10.505], [1.228, -9.067, 11.105], [1.228, -9.067, 11.585], [1.348, -8.827, 11.345]], "changes": [{"kind": "removed", "label": "bag", "text": "A bag that was in the first recording is gone from (-1.3, 1.3).", "at": [-1.305, 1.336, 7.874], "to": null, "lo": [-1.712, 0.833, 7.685], "hi": [-0.992, 2.153, 8.165], "to_lo": null, "to_hi": null}, {"kind": "removed", "label": "chair", "text": "A chair that was in the first recording is gone from (-0.1, -0.1).", "at": [-0.08, -0.149, 7.927], "to": null, "lo": [-0.872, -1.207, 7.565], "hi": [0.568, 0.833, 8.525], "to_lo": null, "to_hi": null}, {"kind": "removed", "label": "table", "text": "A table that was in the first recording is gone from (0.3, -0.4).", "at": [0.331, -0.379, 5.969], "to": null, "lo": [0.088, -0.847, 5.525], "hi": [0.568, 0.113, 6.485], "to_lo": null, "to_hi": null}, {"kind": "added", "label": "bin", "text": "A new bin appeared at (-3.2, -6.2), about 0.72 units tall.", "at": [-3.156, -6.163, 11.721], "to": null, "lo": [-3.392, -6.727, 11.285], "hi": [-2.912, -5.647, 12.005], "to_lo": null, "to_hi": null}, {"kind": "added", "label": "box", "text": "A new box appeared at (-2.5, 0.4), about 0.36 units tall.", "at": [-2.469, 0.431, 7.533], "to": null, "lo": [-2.672, 0.113, 7.325], "hi": [-2.072, 0.833, 7.685], "to_lo": null, "to_hi": null}, {"kind": "added", "label": "lamp", "text": "A new lamp appeared at (-1.9, -0.3), about 0.72 units tall.", "at": [-1.869, -0.345, 7.125], "to": null, "lo": [-2.312, -0.607, 6.845], "hi": [-1.232, -0.007, 7.565], "to_lo": null, "to_hi": null}, {"kind": "added", "label": "box", "text": "A new box appeared at (-1.1, -0.6), about 0.72 units tall.", "at": [-1.076, -0.583, 6.491], "to": null, "lo": [-1.472, -0.847, 6.125], "hi": [-0.752, -0.367, 6.845], "to_lo": null, "to_hi": null}], "stats": {"voxel": 0.12, "unit": "units", "grid_shape": [63, 106, 140], "voxels_total": 934920, "voxels_seen_in_both": 162396, "voxels_seen_in_both_pct": 17.4, "voxels_unverified": 2572, "static_occupied": 108, "changes": 7, "kinds": {"moved": 0, "added": 4, "removed": 3}, "labels": "clip"}};
const COL = {moved:0xf0a030, added:0x3cb371, removed:0xe0484a};

document.getElementById('title').textContent = DATA.title;
const s = DATA.stats;
const labelNote = (s.labels === 'clip')
  ? 'Labels come from CLIP on frame crops.'
  : 'Labels are shape-based guesses.';
document.getElementById('notes').textContent =
  `${s.voxels_seen_in_both_pct}% of the room was seen by both recordings. Only that part is compared. ` +
  `Units: ${DATA.unit}. ${labelNote}`;

const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
view.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf6f6f3);
const camera = new THREE.PerspectiveCamera(50, 1, 0.01, 200);
camera.up.set(0, 0, 1);
const center = new THREE.Vector3(...DATA.lo.map((v, i) => (v + DATA.hi[i]) / 2));
camera.position.copy(center).add(new THREE.Vector3(-6, -6, 5));
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(center);

function points(arr, color, size, opacity) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(arr.flat(), 3));
  const m = new THREE.PointsMaterial({color, size, transparent: true, opacity});
  return new THREE.Points(g, m);
}
function box(lo, hi, color) {
  const size = hi.map((v, i) => v - lo[i]);
  const mid = lo.map((v, i) => (v + hi[i]) / 2);
  const e = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(...size)),
                                   new THREE.LineBasicMaterial({color}));
  e.position.set(...mid);
  return e;
}

scene.add(points(DATA.static, 0x9a9a95, 0.035, 0.7));
const grid = new THREE.GridHelper(Math.max(DATA.hi[0] - DATA.lo[0], DATA.hi[1] - DATA.lo[1]), 10, 0x888888, 0xcccccc);
grid.rotation.x = Math.PI / 2;
grid.position.set(center.x, center.y, DATA.lo[2]);
scene.add(grid);

const list = document.getElementById('list');
DATA.changes.forEach((c) => {
  const col = COL[c.kind];
  scene.add(box(c.lo, c.hi, col));
  let mid = new THREE.Vector3(...c.at);
  if (c.kind === 'moved') {
    scene.add(box(c.to_lo, c.to_hi, col));
    const from = new THREE.Vector3(...c.at), to = new THREE.Vector3(...c.to);
    const dir = to.clone().sub(from);
    scene.add(new THREE.ArrowHelper(dir.clone().normalize(), from, dir.length(), col, 0.2, 0.12));
    mid = from.clone().add(to).multiplyScalar(0.5);
  }
  const li = document.createElement('li');
  li.innerHTML = `<span class="k">${c.kind}</span>: ${c.label}<br><span style="color:var(--muted)">${c.text}</span>`;
  li.onclick = () => { controls.target.copy(mid); camera.position.copy(mid).add(new THREE.Vector3(-3, -3, 2.5)); };
  list.appendChild(li);
});
if (!DATA.changes.length) list.innerHTML = '<li>No changes found.</li>';

function resize() {
  const w = view.clientWidth, h = view.clientHeight || 500;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body></html>
